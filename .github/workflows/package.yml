name: Windows distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install portable Inno Setup compiler
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Prepare pinned bundled media runtime
        shell: pwsh
        run: ./scripts/prepare-media-bundle.ps1
      - name: Build installer and portable distribution
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Validate distribution and installer lifecycle
        shell: pwsh
        run: ./scripts/test-package.ps1 -TestInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: GenexDome-windows-x64
          path: |
            dist/GenexDome-*-windows-x64-setup.exe
            dist/GenexDome-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
