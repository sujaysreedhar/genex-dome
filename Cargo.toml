[package]
name = "genex-dom-player"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Native dome media, projection and calibration workstation"
license = "MIT"

[[bin]]
name = "GenexDomPlayer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "tiff", "webp", "gif"] }
rfd = "0.15"
rodio = "=0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
lto = "thin"
strip = true
